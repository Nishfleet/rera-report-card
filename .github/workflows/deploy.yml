# Deploy on merge (fleet-ops#10935, "one lane ... deploy on merge"), with
# Cloudflare's official action and the production settings in wrangler.toml.
# The production secret SECRET comes from the repository secret of the same
# name and is synced on every deploy, so a rotated value needs no console step.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A queued deploy waits for the running one instead of cancelling it.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://rera-report-card.nishant345.workers.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22, package-manager-cache: false}
      - run: npm ci
      - name: Record the serving Worker version, the rollback target
        run: |
          target=$(npx wrangler@4.155.0 deployments status --json | jq -r '[.versions[] | select(.percentage == 100) | .version_id][0]')
          if [ -z "$target" ] || [ "$target" = "null" ]; then
            echo "::error::Could not read the serving Worker version id. Refusing to deploy with no rollback target." >&2
            exit 1
          fi
          echo "ROLLBACK_TARGET=$target" >> "$GITHUB_ENV"
          echo "Rollback target: $target" >> "$GITHUB_STEP_SUMMARY"
        # The token stays off `npm ci`, so no dependency install script runs beside it.
        env: &cloudflare
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.155.0"
          command: deploy
          secrets: |
            SECRET
        env:
          SECRET: ${{ secrets.SECRET }}
      - name: Smoke the production URL
        id: smoke
        timeout-minutes: 3
        run: curl -fsS -o /dev/null --retry 10 --retry-all-errors --retry-delay 6 https://rera-report-card.nishant345.workers.dev
      - name: Roll back to the serving Worker version
        if: always() && steps.deploy.outcome == 'success' && steps.smoke.outcome != 'success'
        run: npx wrangler@4.155.0 rollback "$ROLLBACK_TARGET" --yes --message "smoke failed $GITHUB_SHA"
        env: *cloudflare
