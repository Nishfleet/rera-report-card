# Deploy on merge (fleet-ops#10935, "one lane ... deploy on merge") with the
# cf CLI and the production settings in cloudflare.config.ts. The production
# secret SECRET comes from the repository secret of the same name and is
# synced on every deploy, so a rotated value needs no console step.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # cf's anonymous usage telemetry, off for CI jobs (Cloudflare docs, "Use cf in CI").
    env:
      CF_SEND_TELEMETRY: "false"
    # A queued deploy waits for the running one instead of cancelling it.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://rera-report-card.nishant345.workers.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22, package-manager-cache: false}
      - run: npm ci
      - name: Record the serving Worker version, the rollback target
        # The first deployment in the list serves traffic; it holds one version
        # at 100%. cf prints the endpoint's result as JSON: with the API
        # envelope when it has one, and as a bare array when it unwraps
        # `result_info`, so the filter accepts both shapes.
        run: |
          target=$(npx cf workers deployments list --worker rera-report-card \
            | jq -r '(.result? // .) | (if type == "array" then . else (.deployments? // [.]) end) | .[0] | [.versions[] | select(.percentage == 100) | .version_id][0]')
          if [ -z "$target" ] || [ "$target" = "null" ]; then
            echo "::error::Could not read the serving Worker version id. Refusing to deploy with no rollback target." >&2
            exit 1
          fi
          echo "ROLLBACK_TARGET=$target" >> "$GITHUB_ENV"
          echo "Rollback target: $target" >> "$GITHUB_STEP_SUMMARY"
        # The token stays off `npm ci`, so no dependency install script runs beside it.
        env: &cloudflare
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Build the Worker
        # cf build bundles with the Cloudflare Vite plugin (vite.config.ts) and
        # needs no credentials; the deploy below takes the Build Output with
        # --prebuilt and the mode the build recorded.
        run: npx cf build
      - name: Apply pending D1 migrations
        # db/schema.sql is the only migration; CREATE TABLE IF NOT EXISTS makes
        # the first apply the only one that changes the database.
        run: npx cf d1 migrations apply 1dc0ddec-8c0a-4a96-bf7e-29672a53516a --dir db
        env: *cloudflare
      - id: deploy
        name: Deploy
        # The secrets file is JSON, built with node so no byte of SECRET is
        # touched by dotenv-style expansion.
        run: |
          umask 077
          node -e 'process.stdout.write(JSON.stringify({ SECRET: process.env.SECRET }))' > "$RUNNER_TEMP/report-card-secrets.json"
          npx cf deploy --prebuilt --mode production --secrets-file "$RUNNER_TEMP/report-card-secrets.json"
          rm -f "$RUNNER_TEMP/report-card-secrets.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET: ${{ secrets.SECRET }}
      - name: Smoke the production URL
        id: smoke
        timeout-minutes: 3
        run: curl -fsS -o /dev/null --retry 10 --retry-all-errors --retry-delay 6 https://rera-report-card.nishant345.workers.dev
      - name: Roll back to the serving Worker version
        if: always() && steps.deploy.outcome == 'success' && steps.smoke.outcome != 'success'
        # The smoke checks the site code, not a rotated SECRET, so the rollback
        # deploys the recorded version even though the versions disagree on
        # secret values (that is what --bypass-deployment-checks skips).
        run: |
          npx cf workers deployments create --worker rera-report-card --strategy percentage \
            --bypass-deployment-checks \
            --versions "[{\"version_id\":\"$ROLLBACK_TARGET\",\"percentage\":100}]"
        env: *cloudflare
