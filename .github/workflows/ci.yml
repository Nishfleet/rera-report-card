name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect package.json
        id: detect
        run: |
          if [ -f package.json ]; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "No package.json yet, skipping tests"; fi
      - if: steps.detect.outputs.has == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - if: steps.detect.outputs.has == 'true'
        run: npm ci
      - if: steps.detect.outputs.has == 'true'
        run: npm run typecheck && npm run test:coverage

  live-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Reach proof: loads the live Gurugram list and one detail page, parses both, no CAPTCHA solving.
      - name: Live Haryana fetch
        env:
          LIVE_FETCH: "1"
        run: npx vitest run tests/hr/live.test.ts

  ci-ok:
    needs: [test, live-fetch]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check results
        env:
          TEST: ${{ needs.test.result }}
          LIVE: ${{ needs.live-fetch.result }}
        run: |
          echo "test=$TEST live-fetch=$LIVE"
          [ "$LIVE" = success ] || exit 1
          [ "$TEST" = success ] || [ "$TEST" = skipped ] || exit 1
