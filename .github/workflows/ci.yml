# The boring lane (fleet-ops#10935): GitHub-hosted runners, one file, and every
# job names the incident or standing rule that keeps it. The main ruleset
# requires `ci-ok`, which needs every job here. Every job runs on pull_request
# and on merge_group, because the queue evaluates checks on its own merge ref
# (GitHub docs, "Managing a merge queue").
name: CI

on:
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Standing rule: nothing reaches main without a live-verified check at its
    # head SHA (global-standing-rules, "Fan out to the governors").
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage

  lint:
    # Incident: rera-report-card#47 (fixed by #56), the no-comments lint gate
    # must run on every pull request, not only on main.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run lint

  preview:
    # Owner decision 2026-11-01 (fleet-ops#10935): a preview link the owner can
    # click is the last gate of every product PR. Cloudflare's official action
    # runs `wrangler preview`, which gives this PR its own copy of the Worker
    # at https://pr-<number>-rera-report-card.nishant345.workers.dev, backed by
    # the preview database named in wrangler.toml. The GitHub environment
    # records that URL, so the PR shows a "View deployment" button.
    # The merge queue has no pull request to preview, so the job skips there,
    # and GitHub counts a skipped required check as passed.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: preview
      url: ${{ steps.preview.outputs.preview-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22, package-manager-cache: false}
      - run: npm ci
      - id: preview
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.155.0"
          command: preview --name pr-${{ github.event.pull_request.number }}

  dependency-review:
    # GitHub's own check: fails a PR that adds a dependency with a known vulnerability.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  ci-ok:
    # Incident: #7 (fixed by #55), the required check must need every gate job
    # above, so a dropped or renamed job fails closed. The main ruleset requires
    # this one check. A skipped preview passes only in the merge queue, which
    # has no pull request to preview.
    needs: [test, lint, preview]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          TEST: ${{ needs.test.result }}
          LINT: ${{ needs.lint.result }}
          PREVIEW: ${{ needs.preview.result }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "test=$TEST lint=$LINT preview=$PREVIEW event=$EVENT"
          [ "$TEST" = success ] || { echo "test=$TEST" >&2; exit 1; }
          [ "$LINT" = success ] || { echo "lint=$LINT" >&2; exit 1; }
          [ "$PREVIEW" = success ] || { [ "$EVENT" = merge_group ] && [ "$PREVIEW" = skipped ]; } || { echo "preview=$PREVIEW" >&2; exit 1; }
