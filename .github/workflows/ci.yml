name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Detect package.json
        id: detect
        run: |
          if [ -f package.json ]; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "No package.json yet, skipping tests"; fi
      - if: steps.detect.outputs.has == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - if: steps.detect.outputs.has == 'true'
        run: npm ci
      - if: steps.detect.outputs.has == 'true'
        run: npm run typecheck && npm run test:coverage

  live-reach:
    # Whether the Haryana portal answers is a fact about the portal, not about
    # the pull request. Measure it here so a portal outage skips the proof
    # instead of failing every PR: haryanarera.gov.in stopped answering GitHub
    # runners between 2026-10-23 and 2026-10-25 and froze every PR on this repo
    # at a red ci-ok.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      reachable: ${{ steps.probe.outputs.reachable }}
    steps:
      - name: Probe haryanarera.gov.in
        id: probe
        env:
          # The exact page the proof below reads first, fetched with the same
          # browser identity the fetcher sends, so this measures what the
          # proof will meet rather than what the site's front page does.
          # listUrl("2") in src/states/hr/fetcher.ts builds this URL.
          PORTAL: https://haryanarera.gov.in/admincontrol/registered_projects/2
          UA: Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/130 Safari/537.36
        run: |
          code=$(curl -sS -L -o /dev/null --max-time 20 -A "$UA" -w '%{http_code}' "$PORTAL" || true)
          echo "$PORTAL answered $code"
          if [ "$code" = 200 ]; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$PORTAL answered $code from this runner, so the live fetch proof did not run. Run the Portal reach probe workflow to see every portal's state."
          fi

  live-fetch:
    needs: live-reach
    if: needs.live-reach.outputs.reachable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Reach proof: loads the live Gurugram list and one detail page, parses both, no CAPTCHA solving.
      - name: Live Haryana fetch
        env:
          LIVE_FETCH: "1"
        run: npx vitest run tests/hr/live.test.ts

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Detect package.json
        id: detect
        run: |
          if [ -f package.json ]; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "No package.json yet, skipping lint"; fi
      - if: steps.detect.outputs.has == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - if: steps.detect.outputs.has == 'true'
        run: npm ci
      - if: steps.detect.outputs.has == 'true'
        run: npm run lint

  ci-ok:
    needs: [test, live-reach, live-fetch, lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check results
        env:
          TEST: ${{ needs.test.result }}
          REACH: ${{ needs.live-reach.result }}
          LIVE: ${{ needs.live-fetch.result }}
          LINT: ${{ needs.lint.result }}
        run: |
          echo "test=$TEST live-reach=$REACH live-fetch=$LIVE lint=$LINT"
          # A portal that does not answer skips the proof. A portal that
          # answers and breaks the parse still fails the build, so the proof
          # keeps its teeth.
          [ "$LIVE" = success ] || [ "$LIVE" = skipped ] || { echo "live-fetch=$LIVE" >&2; exit 1; }
          [ "$TEST" = success ] || [ "$TEST" = skipped ] || { echo "test=$TEST" >&2; exit 1; }
          [ "$LINT" = success ] || [ "$LINT" = skipped ] || { echo "lint=$LINT" >&2; exit 1; }
          # The probe has to succeed itself. A failed live-reach leaves
          # live-fetch skipped, so without this line a red probe merges green
          # with the live proof silently dropped. live-reach has no if: and
          # this workflow has no path filter, so it reports success or failure
          # and never skipped: a later edit that skips it fails here on
          # purpose instead of dropping the proof quietly. Each failure names the
          # job that caused it, so a red gate is read without counting lines.
          [ "$REACH" = success ] || { echo "live-reach=$REACH" >&2; exit 1; }
