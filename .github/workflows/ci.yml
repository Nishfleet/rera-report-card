# The boring lane (fleet-ops#10935): GitHub-hosted runners, one file, and every
# job names the incident or standing rule that keeps it. The main ruleset
# requires `ci-ok`, which needs every gate job here. Every job runs on pull_request
# and on merge_group, because the queue evaluates checks on its own merge ref
# (GitHub docs, "Managing a merge queue").
name: CI

on:
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Standing rule: nothing reaches main without a live-verified check at its
    # head SHA (global-standing-rules, "Fan out to the governors").
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage

  lint:
    # Incident: rera-report-card#47 (fixed by #56), the no-comments lint gate
    # must run on every pull request, not only on main.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run lint

  preview:
    # Owner decision 2026-11-01 (fleet-ops#10935): a preview link the owner can
    # click is the last gate of every product PR. `cf previews deploy` gives
    # this PR its own copy of the Worker at
    # https://pr-<number>-rera-report-card.nishant345.workers.dev, backed by
    # the preview database in cloudflare.config.ts. The GitHub environment
    # records that URL, so the PR shows a "View deployment" button.
    # Not a required check. It skips in the merge queue (no pull request) and
    # for forks and Dependabot, whose runs get no Actions secrets (GitHub docs,
    # "Automating Dependabot with GitHub Actions").
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: preview
      url: ${{ steps.preview.outputs.preview-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22, package-manager-cache: false}
      - run: npm ci
      - id: preview
        # cf sends anonymous usage telemetry; turn it off for CI jobs
        # (Cloudflare docs, "Use cf in CI"). The URL is the pattern cf previews
        # deploys under; a step output, because the environment needs it.
        env:
          CF_SEND_TELEMETRY: "false"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx cf previews deploy pr-${{ github.event.pull_request.number }}
          echo "preview-url=https://pr-${{ github.event.pull_request.number }}-rera-report-card.nishant345.workers.dev" >> "$GITHUB_OUTPUT"

  dependency-review:
    # GitHub's own check: fails a PR that adds a dependency with a known vulnerability.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  ci-ok:
    # Incident: #7 (fixed by #55), the required check must need every gate job
    # above, so a dropped or renamed job fails closed. The main ruleset requires
    # this one check. The preview stays visible on the PR but does not gate it.
    needs: [test, lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          TEST: ${{ needs.test.result }}
          LINT: ${{ needs.lint.result }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "test=$TEST lint=$LINT event=$EVENT"
          [ "$TEST" = success ] || { echo "test=$TEST" >&2; exit 1; }
          [ "$LINT" = success ] || { echo "lint=$LINT" >&2; exit 1; }
